name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend_fastapi
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: confidia
          POSTGRES_PASSWORD: confidia_secret
          POSTGRES_DB: confidia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U confidia -d confidia"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://confidia:confidia_secret@localhost:5432/confidia

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install ".[dev]"

      - name: Lint with ruff
        continue-on-error: true
        run: ruff check .

      - name: Apply MVP schema
        run: alembic upgrade head

      - name: Run tests
        run: pytest --cov=. --cov-report=xml -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend_flutter

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test
